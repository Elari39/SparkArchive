# 国际共产主义运动大事年表
events:
  - year: 1848
    date_text: 2月
    title: 《共产党宣言》发表
    body: 马克思、恩格斯受共产主义者同盟委托撰写，以"全世界无产者，联合起来！"作结，标志马克思主义诞生。
    location: 伦敦
    category: 理论
    people: [marx, engels]
  - year: 1864
    date_text: 9月
    title: 第一国际成立
    body: 国际工人协会在伦敦成立，马克思起草成立宣言与章程，推动各国工人运动联合。
    location: 伦敦
    category: 组织
    people: [marx, engels]
  - year: 1867
    date_text: 9月
    title: 《资本论》第一卷出版
    body: 马克思系统阐述剩余价值理论，揭示资本主义剥削的秘密，政治经济学由此完成革命性变革。
    location: 汉堡
    category: 理论
    people: [marx]
  - year: 1871
    date_text: 3月
    title: 巴黎公社成立
    body: 世界上第一个无产阶级政权雏形，存续七十二天。马克思以《法兰西内战》总结其经验与教训。
    location: 巴黎
    category: 革命
    people: [marx, engels]
  - year: 1883
    date_text: 3月14日
    title: 马克思逝世
    body: 马克思在伦敦寓所逝世。恩格斯在墓前演说中称"他的英名和事业将永垂不朽"。
    location: 伦敦
    category: 牺牲
    people: [marx]
  - year: 1889
    date_text: 7月
    title: 第二国际成立
    body: 国际社会主义者代表大会在巴黎召开，第二国际成立。蔡特金作为德国妇女代表发表《为了妇女的解放》的演讲，被推选为大会书记之一。
    location: 巴黎
    category: 组织
    people: [engels, zetkin]
  - year: 1895
    date_text: 8月5日
    title: 恩格斯逝世
    body: 恩格斯在伦敦逝世，遗嘱将马克思手稿与文献移交德国社会民主党。
    location: 伦敦
    category: 牺牲
    people: [engels]
  - year: 1899
    date_text: 年中
    title: 《社会改良还是革命？》出版
    body: 卢森堡系统批判伯恩施坦修正主义，论证社会改良不能替代社会革命，成为第二国际内部理论斗争的焦点。
    location: 柏林
    category: 理论
    people: [luxemburg]
  - year: 1902
    date_text: 3月
    title: 《怎么办？》出版
    body: 列宁提出先锋队理论，主张建立职业革命家组织，批判经济派的自发论。
    location: 斯图加特
    category: 理论
    people: [lenin]
  - year: 1910
    date_text: 8月
    title: 国际社会主义妇女代表会议确立妇女节
    body: 哥本哈根第二届国际社会主义妇女代表会议根据蔡特金的倡议，规定每年设立一个国际妇女节，以推动劳动妇女争取选举权和社会权利。
    location: 哥本哈根
    category: 组织
    people: [zetkin]
  - year: 1913
    date_text: 年中
    title: 《资本积累论》出版
    body: 卢森堡拓展马克思的资本积累理论，论证资本主义必须向非资本主义地区扩张，把帝国主义归结为一种特定的积累方法。该书在第二国际内部引发激烈争论。
    location: 柏林
    category: 理论
    people: [luxemburg]
  - year: 1914
    date_text: 8月
    title: 第二国际的破产
    body: 第一次世界大战爆发，德国社会民主党议会党团投票支持战争拨款，第二国际各主要政党纷纷倒向本国政府。卢森堡、蔡特金等左派与之决裂。
    location: 柏林
    category: 组织
    people: [luxemburg, zetkin]
  - year: 1916
    date_text: 4月
    title: 《社会民主党的危机》秘密出版
    body: 卢森堡以"尤尼乌斯"笔名在狱中写成的小册子秘密出版，控诉社会民主党右翼背叛无产阶级国际主义，提出"社会主义还是野蛮状态"的历史抉择。
    location: 柏林
    category: 理论
    people: [luxemburg]
  - year: 1916
    date_text: 年中
    title: 《帝国主义是资本主义的最高阶段》
    body: 列宁论证帝国主义是资本主义的垄断阶段，提出"帝国主义是无产阶级革命的前夜"。
    location: 苏黎世
    category: 理论
    people: [lenin]
  - year: 1917
    date_text: 11月7日
    title: 十月革命
    body: 俄国工人阶级在布尔什维克领导下夺取政权，建立世界上第一个社会主义国家。
    location: 彼得格勒
    category: 革命
    people: [lenin]
  - year: 1919
    date_text: 1月15日
    title: 卢森堡与李卜克内西遇害
    body: 柏林工人起义遭"自由军团"镇压，德国共产党领导人卢森堡与卡尔·李卜克内西被捕后遭杀害，成为德国工人运动最沉痛的损失。
    location: 柏林
    category: 牺牲
    people: [luxemburg]
  - year: 1919
    date_text: 3月
    title: 共产国际成立
    body: 第三国际在莫斯科成立，推动世界革命，后于1943年解散。1935年季米特洛夫当选其总书记。
    location: 莫斯科
    category: 组织
    people: [lenin, dimitrov]
  - year: 1919
    date_text: 5月4日
    title: 五四运动
    body: 反帝反封建的爱国运动，马克思主义在中国广泛传播，为中国共产党的成立准备了条件。
    location: 北京
    category: 革命
    people: [mao]
  - year: 1921
    date_text: 7月
    title: 中国共产党成立
    body: 中国共产党第一次全国代表大会在上海召开，中国革命从此有了无产阶级政党的领导。
    location: 上海
    category: 组织
    people: [mao]
  - year: 1924
    date_text: 1月21日
    title: 列宁逝世
    body: 列宁在哥尔克村逝世。全党宣誓继承其遗志。
    location: 哥尔克
    category: 牺牲
    people: [lenin]
  - year: 1927
    date_text: 9月
    title: 秋收起义与井冈山道路
    body: 毛泽东领导湘赣边界秋收起义，随后转向农村建立革命根据地，开辟农村包围城市的道路。
    location: 湘赣边界
    category: 革命
    people: [mao]
  - year: 1928
    date_text: 6月14日
    title: 切·格瓦拉出生
    body: 生于阿根廷罗萨里奥一个中产家庭，日后成为古巴革命领袖与国际主义战士。
    location: 罗萨里奥
    category: 生平
    people: [guevara]
  - year: 1930
    date_text: 2月3日
    title: 越南共产党成立
    body: 胡志明在香港九龙主持召开建党会议，通过他起草的简要政纲与党章，把越南国内各共产主义组织统一为越南共产党。
    location: 中国香港
    category: 组织
    people: [ho-chi-minh]
  - year: 1933
    date_text: 9月21日
    title: 莱比锡审判
    body: 纳粹当局借国会纵火案在莱比锡开庭审讯季米特洛夫。他拒绝依赖法庭指定的辩护人，自行辩护揭露纵火案是法西斯策划的阴谋，同年12月被宣告无罪，成为世界反法西斯斗争的象征。
    location: 莱比锡
    category: 革命
    people: [dimitrov]
  - year: 1934
    date_text: 10月
    title: 长征开始
    body: 红军被迫战略转移，历时两年行程二万五千里，毛泽东在遵义会议后重新确立领导地位。
    location: 江西
    category: 战争
    people: [mao]
  - year: 1935
    date_text: 8月
    title: 共产国际第七次代表大会
    body: 季米特洛夫作报告，论证法西斯主义是财政资本的公开恐怖专政，提出建立反法西斯统一战线，并当选共产国际执委会总书记。
    location: 莫斯科
    category: 组织
    people: [dimitrov]
  - year: 1936
    date_text: 10月
    title: 国际纵队成立
    body: 西班牙内战爆发后，在季米特洛夫倡议与组织下，来自五十四个国家的共产党员和志愿人员组成国际纵队，与西班牙人民并肩抗击法西斯。
    location: 西班牙
    category: 革命
    people: [dimitrov]
  - year: 1938
    date_text: 5月
    title: 《论持久战》发表
    body: 毛泽东科学预判抗日战争三个阶段，驳斥"亡国论"与"速胜论"，指明胜利道路。
    location: 延安
    category: 理论
    people: [mao]
  - year: 1942
    date_text: 5月
    title: 延安文艺座谈会
    body: 毛泽东发表讲话，提出文艺为工农兵服务的方向，确立革命文艺的根本方针。
    location: 延安
    category: 文化
    people: [mao]
  - year: 1945
    date_text: 9月2日
    title: 越南民主共和国成立
    body: 八月革命胜利后，胡志明在河内巴亭广场宣读《独立宣言》，宣告越南民主共和国成立，这是东南亚第一个由共产党领导建立的共和国。
    location: 河内
    category: 建设
    people: [ho-chi-minh]
  - year: 1949
    date_text: 10月1日
    title: 中华人民共和国成立
    body: 毛泽东在天安门城楼宣告中华人民共和国中央人民政府成立，中国人民从此站起来了。
    location: 北京
    category: 建设
    people: [mao]
  - year: 1954
    date_text: 5月7日
    title: 奠边府战役胜利
    body: 越南军民取得奠边府战役胜利，法国在印度支那的殖民统治由此终结，同年日内瓦会议结束法国在印度支那的百年殖民统治。
    location: 奠边府
    category: 战争
    people: [ho-chi-minh]
  - year: 1956
    date_text: 4月
    title: 《论十大关系》
    body: 毛泽东论述重工业与轻工业、农业等十大关系，探索适合中国国情的社会主义建设道路。
    location: 北京
    category: 建设
    people: [mao]
  - year: 1959
    date_text: 1月1日
    title: 古巴革命胜利
    body: 巴蒂斯塔政权垮台，格瓦拉率部进入哈瓦那，古巴革命取得胜利。
    location: 哈瓦那
    category: 革命
    people: [guevara]
  - year: 1960
    date_text: 年中
    title: 《游击战》出版
    body: 格瓦拉总结古巴经验，提出游击中心主义，主张以游击战推动拉美革命。
    location: 哈瓦那
    category: 理论
    people: [guevara]
  - year: 1965
    date_text: 3月
    title: 《古巴的人与社会主义》发表
    body: 格瓦拉批判物质激励与官僚化倾向，提出塑造"社会主义新人"的主张。
    location: 哈瓦那
    category: 理论
    people: [guevara]
  - year: 1967
    date_text: 10月9日
    title: 切·格瓦拉牺牲
    body: 格瓦拉在玻利维亚游击战中受伤被俘后遭杀害，成为国际主义革命的象征。
    location: 玻利维亚
    category: 牺牲
    people: [guevara]
  - year: 1969
    date_text: 9月2日
    title: 胡志明逝世
    body: 胡志明在河内逝世，享年79岁。越南政府公布其逝世时间为9月3日，以免与国庆纪念重叠。
    location: 河内
    category: 牺牲
    people: [ho-chi-minh]
