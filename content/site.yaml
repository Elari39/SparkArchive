tagline: 全世界无产者，联合起来！
subtitle: 无产阶级革命理论与实践的文献档案
description: >-
  星火档案馆收录马克思、恩格斯、列宁、毛泽东、切·格瓦拉等十五位革命者的生平、著作与思想，
  上溯德国与俄国的理论源流，下及中国、越南、古巴、布基纳法索与拉丁美洲的革命实践，
  记录国际共产主义运动的理论发展与实践历程。
