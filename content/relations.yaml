# 人物关系图：节点由 people/ 自动生成，此处只定义边
edges:
  - from: marx
    to: engels
    kind: 合作
    label: 共著与终身合作
    note: 1844年巴黎相识，合著《神圣家族》《德意志意识形态》《共产党宣言》，恩格斯整理出版《资本论》第二、三卷。
  - from: marx
    to: lenin
    kind: 传承
    label: 继承与发展
    note: 列宁在帝国主义时代发展了马克思主义的无产阶级革命理论。
  - from: engels
    to: lenin
    kind: 传承
    label: 理论中介
    note: 恩格斯对《资本论》的整理与普及，是列宁掌握政治经济学的重要途径。
  - from: lenin
    to: mao
    kind: 传承
    label: 十月革命的道路
    note: 毛泽东称"十月革命一声炮响，给我们送来了马克思列宁主义"，但主张走农村包围城市的中国道路。
  - from: marx
    to: mao
    kind: 传承
    label: 唯物史观与阶级斗争
    note: 毛泽东在《实践论》《矛盾论》中把辩证唯物主义与中国革命经验结合。
  - from: lenin
    to: guevara
    kind: 传承
    label: 帝国主义论与国际主义
    note: 格瓦拉把列宁的帝国主义论运用于拉美反帝斗争，主张国际主义的革命义务。
  - from: mao
    to: guevara
    kind: 借鉴
    label: 游击战与农村根据地
    note: 格瓦拉研究毛泽东的游击战著作，把"农村包围城市"经验移用于拉美，后在玻利维亚受挫。
  - from: guevara
    to: marx
    kind: 溯源
    label: 新人理论
    note: 格瓦拉在《古巴的人与社会主义》中援引马克思的异化理论讨论社会主义新人的塑造。
  - from: marx
    to: luxemburg
    kind: 传承
    label: 资本积累的续写
    note: 卢森堡在《资本积累论》中接续《资本论》第二卷的资本流通过程分析，追问剩余价值如何在全社会范围内实现。
  - from: luxemburg
    to: lenin
    kind: 论战
    label: 资本积累与民族自决的争论
    note: 两人在帝国主义时代同处第二国际左翼，却围绕资本积累的实现条件与民族自决权长期争论。列宁称《资本积累论》"完全歪曲了马克思"，同时始终承认卢森堡是革命之鹰。
  - from: engels
    to: zetkin
    kind: 传承
    label: 马克思主义妇女观
    note: 恩格斯在《家庭、私有制和国家的起源》中论证妇女受压迫的根源在于私有制，蔡特金把这一判断发展为国际社会主义妇女运动的纲领。
  - from: luxemburg
    to: zetkin
    kind: 战友
    label: 斯巴达克同盟与德国共产党
    note: 1914年社会民主党议会党团支持战争拨款后，两人与卡尔·李卜克内西等左派共同组建斯巴达克同盟，并于1918年底共同创建德国共产党。
  - from: lenin
    to: ho-chi-minh
    kind: 传承
    label: 殖民地革命道路
    note: 列宁的民族和殖民地问题理论为殖民地国家革命提供了理论依据；胡志明在《革命之路》中把它运用于越南的具体条件。
  - from: ho-chi-minh
    to: mao
    kind: 合作
    label: 并肩战斗与相互支援
    note: 胡志明1920年代在广州从事革命活动并得到中国共产党帮助，1942年被国民党当局逮捕时经中国共产党营救获释；抗法战争期间中国向越南提供援助。
  - from: marx
    to: plekhanov
    kind: 传承
    label: 马克思主义在俄国的传播
    note: 普列汉诺夫在流亡期间系统研读马克思、恩格斯的著作，并通过劳动解放社把《共产党宣言》等经典译成俄文，成为俄国马克思主义的奠基人。
  - from: plekhanov
    to: lenin
    kind: 论战
    label: 俄国马克思主义的源流与分歧
    note: 列宁早年深受普列汉诺夫影响，称其哲学著作培育了整整一代俄国马克思主义者；1903年以后两人在党的组织原则与革命策略上长期争论，普列汉诺夫转入孟什维克并反对十月革命。
  - from: lenin
    to: katayama
    kind: 传承
    label: 共产国际与东方革命
    note: 片山潜在十月革命后接受列宁的思想，1921年赴莫斯科参加共产国际工作并当选执行委员，是共产国际中东方革命的重要活动家。
  - from: katayama
    to: li-dazhao
    kind: 支援
    label: 支持被压迫民族的解放斗争
    note: 片山潜多次强调支持中国的解放斗争是日本工人的国际义务，并谴责日本帝国主义对中国的侵略，与中国共产党人站在同一营垒。
  - from: marx
    to: li-dazhao
    kind: 传承
    label: 唯物史观的中国传播
    note: 李大钊在《我的马克思主义观》中系统介绍马克思的唯物史观与剩余价值学说，是中国最早系统传播马克思主义的人。
  - from: lenin
    to: li-dazhao
    kind: 传承
    label: 十月革命的道路
    note: 李大钊在十月革命后率先在中国讴歌这一革命，称它为人类历史的新纪元，并把它看作中国革命的新道路。
  - from: li-dazhao
    to: mao
    kind: 传承
    label: 走向马克思主义的引路人
    note: 毛泽东在北京大学图书馆工作期间受到李大钊的直接影响，后来回忆说自己正是在这一时期迅速朝着马克思主义的方向发展。
  - from: lenin
    to: gramsci
    kind: 传承
    label: 西方道路的探索
    note: 葛兰西高度评价列宁与十月革命，同时从意大利的历史条件出发，提出在市民社会发达的西方国家革命必须采取长期的"阵地战"，拓展了马克思主义的革命策略理论。
  - from: luxemburg
    to: gramsci
    kind: 论战
    label: 群众自发性与领导权
    note: 葛兰西赞赏卢森堡对群众自发行动的重视，也在《狱中札记》中批评其低估了政党领导与文化领导权的作用，两人的分歧涉及革命中自发与自觉的关系。
  - from: engels
    to: kollontai
    kind: 传承
    label: 马克思主义妇女观的源流
    note: 恩格斯在《家庭、私有制和国家的起源》中论证妇女受压迫的根源在于私有制，柯伦泰接续这一判断，进一步提出妇女受阶级与性别的双重压迫。
  - from: zetkin
    to: kollontai
    kind: 战友
    label: 国际社会主义妇女运动
    note: 两人同属第二国际左翼与反战阵营，长期并肩推动国际社会主义妇女运动，但对妇女运动与资产阶级女权运动的关系、家庭问题上的看法并不完全相同。
  - from: lenin
    to: kollontai
    kind: 论战
    label: 工人反对派与党内民主
    note: 柯伦泰领导"工人反对派"，主张工会直接管理经济、扩大党内民主，在党的十大上受到列宁的严厉批评。
  - from: castro
    to: guevara
    kind: 合作
    label: 古巴革命的两面
    note: 两人在墨西哥相识并共同领导古巴革命，卡斯特罗是革命的政治领袖，格瓦拉是最重要的军事指挥员之一，革命胜利后又在经济与外交路线上彼此影响。
  - from: guevara
    to: sankara
    kind: 传承
    label: 国际主义与反帝
    note: 桑卡拉公开推崇格瓦拉的国际主义精神，自称是世界革命的继承人，把支援被压迫民族的解放看作革命的义务。
  - from: castro
    to: sankara
    kind: 传承
    label: 古巴革命榜样的影响
    note: 桑卡拉明确表示自己的革命思想受到卡斯特罗与格瓦拉的榜样的影响，布基纳法索的政策在卫生、扫盲与群众组织方面也借鉴了古巴经验。
