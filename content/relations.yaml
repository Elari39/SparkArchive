# 人物关系图：节点由 people/ 自动生成，此处只定义边
edges:
  - from: marx
    to: engels
    kind: 合作
    label: 共著与终身合作
    note: 1844年巴黎相识，合著《神圣家族》《德意志意识形态》《共产党宣言》，恩格斯整理出版《资本论》第二、三卷。
  - from: marx
    to: lenin
    kind: 传承
    label: 继承与发展
    note: 列宁在帝国主义时代发展了马克思主义的无产阶级革命理论。
  - from: engels
    to: lenin
    kind: 传承
    label: 理论中介
    note: 恩格斯对《资本论》的整理与普及，是列宁掌握政治经济学的重要途径。
  - from: lenin
    to: mao
    kind: 传承
    label: 十月革命的道路
    note: 毛泽东称"十月革命一声炮响，给我们送来了马克思列宁主义"，但主张走农村包围城市的中国道路。
  - from: marx
    to: mao
    kind: 传承
    label: 唯物史观与阶级斗争
    note: 毛泽东在《实践论》《矛盾论》中把辩证唯物主义与中国革命经验结合。
  - from: lenin
    to: guevara
    kind: 传承
    label: 帝国主义论与国际主义
    note: 格瓦拉把列宁的帝国主义论运用于拉美反帝斗争，主张国际主义的革命义务。
  - from: mao
    to: guevara
    kind: 借鉴
    label: 游击战与农村根据地
    note: 格瓦拉研究毛泽东的游击战著作，把"农村包围城市"经验移用于拉美，后在玻利维亚受挫。
  - from: guevara
    to: marx
    kind: 溯源
    label: 新人理论
    note: 格瓦拉在《古巴的人与社会主义》中援引马克思的异化理论讨论社会主义新人的塑造。
  - from: marx
    to: luxemburg
    kind: 传承
    label: 资本积累的续写
    note: 卢森堡在《资本积累论》中接续《资本论》第二卷的资本流通过程分析，追问剩余价值如何在全社会范围内实现。
  - from: luxemburg
    to: lenin
    kind: 论战
    label: 资本积累与民族自决的争论
    note: 两人在帝国主义时代同处第二国际左翼，却围绕资本积累的实现条件与民族自决权长期争论。列宁称《资本积累论》"完全歪曲了马克思"，同时始终承认卢森堡是革命之鹰。
  - from: engels
    to: zetkin
    kind: 传承
    label: 马克思主义妇女观
    note: 恩格斯在《家庭、私有制和国家的起源》中论证妇女受压迫的根源在于私有制，蔡特金把这一判断发展为国际社会主义妇女运动的纲领。
  - from: luxemburg
    to: zetkin
    kind: 战友
    label: 斯巴达克同盟与德国共产党
    note: 1914年社会民主党议会党团支持战争拨款后，两人与卡尔·李卜克内西等左派共同组建斯巴达克同盟，并于1918年底共同创建德国共产党。
  - from: lenin
    to: dimitrov
    kind: 传承
    label: 共产国际的事业
    note: 列宁创建并领导第三国际；季米特洛夫于1935年当选共产国际总书记，把列宁的反帝国际主义推进为反法西斯统一战线的策略。
  - from: dimitrov
    to: mao
    kind: 支持
    label: 反法西斯统一战线
    note: 季米特洛夫在共产国际七大报告中公开支持中国共产党建立抗日民族统一战线，1938年明确主张承认毛泽东在斗争中形成的领袖地位。
  - from: lenin
    to: ho-chi-minh
    kind: 传承
    label: 殖民地革命道路
    note: 列宁的民族和殖民地问题理论为殖民地国家革命提供了理论依据；胡志明在《革命之路》中把它运用于越南的具体条件。
  - from: ho-chi-minh
    to: mao
    kind: 合作
    label: 并肩战斗与相互支援
    note: 胡志明1920年代在广州从事革命活动并得到中国共产党帮助，1942年被国民党当局逮捕时经中国共产党营救获释；抗法战争期间中国向越南提供援助。
